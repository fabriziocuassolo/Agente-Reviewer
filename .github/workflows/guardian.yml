name: Guardian Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # para comentar en el PR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: Guardian compara contra la rama base

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci también compila el CLI (script "prepare").
      - run: npm ci

      - name: Guardian review
        env:
          # La key viene de un secret del repo. Sin key, Guardian corre solo los chequeos determinísticos.
          LLM_PROVIDER: ${{ secrets.GEMINI_API_KEY != '' && 'gemini' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: origin/${{ github.base_ref }}
        # Exit code 1 = BLOQUEADO: no cortamos acá para poder comentar igual; el último paso marca el check en rojo.
        run: node agent/dist/cli.js review --json --base "$BASE_REF" > guardian-report.json || true

      - name: Comentar en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const { publish } = require("./.github/scripts/guardian-comment.cjs");
            await publish({ github, context, core, reportPath: "guardian-report.json" });
